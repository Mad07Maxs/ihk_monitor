<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Monitor Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            cursor: none;
        }
        
        /* Container für einen kompletten Slide (Hintergrund + Vordergrund) */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide.active {
            opacity: 1;
        }

        /* Verschwommener Hintergrund */
        .bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(35px) brightness(0.6); /* Weichzeichner + leicht abgedunkelt für besseren Kontrast */
            transform: scale(1.15); /* Verhindert weiße/transparente Ränder durch den Blur-Effekt */
            z-index: 1;
        }

        /* Scharfes Hauptbild im Vordergrund */
        .fg-main {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.7)); /* Dezenter Schatten hebt das Hauptbild ab */
        }
    </style>
</head>
<body>

    <div id="slide1" class="slide active">
        <img class="bg-blur" src="">
        <img class="fg-main" src="">
    </div>

    <div id="slide2" class="slide">
        <img class="bg-blur" src="">
        <img class="fg-main" src="">
    </div>

    <script>
        let currentConfig = null;
        let currentIndex = 0;
        let activeSlide = 1;
        let slideTimer = null;

        // Prüft alle 15 Sekunden auf neue Einstellungen in der config.json
        async function fetchConfig() {
            try {
                const response = await fetch(`config.json?t=${Date.now()}`);
                if (!response.ok) return;
                const newConfig = await response.json();

                if (JSON.stringify(newConfig) !== JSON.stringify(currentConfig)) {
                    currentConfig = newConfig;
                    currentIndex = 0;
                    restartSlideshow();
                }
            } catch (err) {
                console.error("Verbindungsfehler beim Abrufen der Config:", err);
            }
        }

        function showImage(filename) {
            if (!filename) return;
            const nextSlideNum = activeSlide === 1 ? 2 : 1;
            const nextSlide = document.getElementById(`slide${nextSlideNum}`);
            const currSlide = document.getElementById(`slide${activeSlide}`);

            const nextBg = nextSlide.querySelector('.bg-blur');
            const nextFg = nextSlide.querySelector('.fg-main');

            // Wenn das Hauptbild fertig geladen ist, beide Ebenen gleichzeitig einblenden
            nextFg.onload = () => {
                currSlide.classList.remove('active');
                nextSlide.classList.add('active');
                activeSlide = nextSlideNum;
            };

            const imgSrc = `images/${filename}`;
            nextBg.src = imgSrc;
            nextFg.src = imgSrc;
        }

        function restartSlideshow() {
            if (slideTimer) clearInterval(slideTimer);
            if (!currentConfig) return;

            // Modus 1: Veranstaltungs-Modus
            if (currentConfig.mode === 'event') {
                if (currentConfig.eventImage) {
                    showImage(currentConfig.eventImage);
                }
                return;
            }

            // Modus 2: Allgemeiner Modus
            if (currentConfig.mode === 'general' && currentConfig.pool.length > 0) {
                showImage(currentConfig.pool[0]);
                
                if (currentConfig.pool.length > 1) {
                    const intervalMs = (currentConfig.interval || 10) * 1000;
                    slideTimer = setInterval(() => {
                        currentIndex = (currentIndex + 1) % currentConfig.pool.length;
                        showImage(currentConfig.pool[currentIndex]);
                    }, intervalMs);
                }
            }
        }

        fetchConfig();
        setInterval(fetchConfig, 15000);
    </script>
</body>
</html>
